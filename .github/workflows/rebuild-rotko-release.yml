name: Rebuild rotko-release

# Consumers that install this registry straight from git (for example
# `github:penumbrafi/registry#rotko-release`) cannot run the build themselves:
# a git install has no build step, and the package sources live in `npm/`
# rather than at the repository root. The `rotko-release` branch exists to
# solve both problems. It is `main` plus two things:
#
#   * a root `package.json` shim, so the repository resolves as a package
#     without a nested subpath install;
#   * a committed `npm/dist`, so no build is needed after cloning.
#
# This workflow rebuilds that branch from `main` on every push, so the branch
# can never drift from the registry data it claims to ship. The branch is
# generated output: it is force-updated, and nothing should ever be committed
# to it by hand. See `deploy/README.md` for the manual fallback.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two pushes to main in quick succession would otherwise race to force-push the
# same branch. Queue instead of cancelling, so the last push to main always wins.
concurrency:
  group: rotko-release
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild rotko-release from main
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          # There is no root package.json on main, so the action has to be told
          # where the `packageManager` pin lives.
          package_json_file: npm/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install
        working-directory: npm

      - name: Build npm package
        run: pnpm build
        working-directory: npm

      # `registry/` is not regenerated here: the `Generate registry and Check
      # for Diffs` job in rust-checks.yml already fails main if the committed
      # registry output is stale, so whatever is on main is current by
      # construction.
      - name: Check build output exists
        run: test -f npm/dist/index.js && test -f npm/dist/index.mjs && test -f npm/dist/index.d.ts

      - name: Write root shim package.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { version } = require('./npm/package.json');
          const shim = {
            name: '@penumbra-labs/registry',
            version,
            description:
              'Community release branch of the Penumbra chain/asset registry, published from github.com/penumbrafi/registry. Root-level shim that lets pnpm/npm/bun consume this repository via `github:penumbrafi/registry#rotko-release` without a nested `npm/` subpath install. The package keeps the name `@penumbra-labs/registry` so existing imports and `@penumbra-zone/*` peer ranges resolve unchanged; the real sources live in `./npm`, whose prebuilt `dist/` is committed here so a git install needs no build step.',
            main: './npm/dist/index.js',
            module: './npm/dist/index.mjs',
            types: './npm/dist/index.d.ts',
            sideEffects: false,
            files: ['npm/dist'],
            repository: {
              type: 'git',
              url: 'git+https://github.com/penumbrafi/registry.git',
            },
            license: 'MIT',
            private: false,
          };
          fs.writeFileSync('package.json', JSON.stringify(shim, null, 2) + '\n');
          console.log(`shim version ${version}`);
          NODE

      - name: Force-update rotko-release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Start from the commit that was just pushed to main and add the two
          # generated artifacts on top. `npm/dist` and the root package.json are
          # gitignored on main, hence `add -f`.
          git checkout -B rotko-release
          git add -f npm/dist package.json

          version="$(node -p "require('./npm/package.json').version")"
          git commit -m "rotko-release: rebuild shim + dist from main (${version})" \
                     -m "Generated by .github/workflows/rebuild-rotko-release.yml from ${GITHUB_SHA}." \
                     --allow-empty

          git push --force origin rotko-release
