name: Version Packages

# Publishing to npm is done manually by a maintainer (see README "Publishing").
# This workflow only keeps the changesets "Version Packages" PR up to date: it
# never publishes and needs no npm token.

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open or update the Version Packages PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # There is no root package.json in this repo, so the action has to be
      # told where the `packageManager` pin lives.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: npm/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Create or update the Version Packages PR
        uses: changesets/action@v1.5.2
        with:
          cwd: "${{ github.workspace }}/npm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
