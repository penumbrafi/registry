name: Publish to Npm

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  # changesets opens/updates the "Version Packages" PR
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # No `version:` input: npm/package.json pins pnpm via `packageManager`,
      # and passing both makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      # If there are changesets, this action will create a PR on the repo to version packages
      # If there are none, it will publish newer-versioned public packages to npm
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # Pin version for changeset action helper; refs https://github.com/prax-wallet/registry/issues/147
        uses: changesets/action@v1.5.2
        with:
          publish: pnpm changeset:publish
          cwd: "${{ github.workspace }}/npm"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
